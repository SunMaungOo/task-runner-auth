name: Go Test CI

on:
  push:
    branches: [master]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.9'
      
      - name: Run tests
        run: go test -v -race -cover ./internal/test
